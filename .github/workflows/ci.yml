name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true

      - name: Check all
        run: pixi run check

      - name: Check issue templates are up-to-date
        run: |
          pixi run generate-issue-templates
          pixi run format .github/ISSUE_TEMPLATE/
          git diff --exit-code .github/ISSUE_TEMPLATE/
